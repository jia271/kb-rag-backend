spring:
  application:
    name: kb-rag-backend
  codec:
    max-in-memory-size: 8MB
  datasource:
    # 开发期先用 H2 文件库，免安装。后期换 PostgreSQL 基本只改这一行。
    url: jdbc:h2:file:./data/kb;MODE=PostgreSQL
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.rag: DEBUG
  pattern:
    # 把追踪号打进每一行日志，便于按一次请求把日志串起来
    console: "%d{HH:mm:ss.SSS} %5p [%X{traceId:--------}] [%15.15t] %-36.36logger{36} : %m%n"

# 模型接入配置：多提供方从第一天就预留好，M4 阶段直接在这里加备选模型
app:
  llm:
    default-provider: deepseek
    # 降级顺序：默认提供方排最前，失败后依次尝试后面的
    fallback-order:
      - deepseek
      - deepseek-pro
    providers:
      deepseek:
        enabled: true
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:}
        chat-model: deepseek-chat
        timeout: 60s
        # 单价为占位值，请按你账户的实际计费填写（单位：元 / 千 token）
        price-per-1k-prompt: 0.002
        price-per-1k-completion: 0.008
      # 备用提供方：同一个密钥、换一个模型，用来演示和验证自动降级
      deepseek-pro:
        enabled: true
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:}
        chat-model: deepseek-v4-pro
        timeout: 60s
        price-per-1k-prompt: 0.004
        price-per-1k-completion: 0.012
  ingestion:
    # 上传的原始文件落盘位置
    storage-dir: ./data/uploads
  chunking:
    # 分块策略：单块目标长度、块间重叠、允许的最小块
    max-chars: 800
    overlap-chars: 120
    min-chars: 120
  # 向量化：DeepSeek 只有对话模型，没有 embedding 接口，所以这里要单独配置来源
  embedding:
    default-provider: local
    batch-size: 16
    providers:
      # 本地兜底：不需要密钥，基于字符 n-gram 哈希。
      # 只保证检索链路能跑通，语义效果远不如真实向量模型。
      local:
        enabled: true
        dimensions: 512
      # 真实向量模型示例（硅基流动，OpenAI 兼容协议，有免费额度）。
      # 注册后把密钥填进 .env.local 的 SILICONFLOW_API_KEY，再把 default-provider 改成 siliconflow，
      # 然后调用一次 POST /api/search/reindex 重建索引即可。
      siliconflow:
        enabled: false
        base-url: https://api.siliconflow.cn/v1
        api-key: ${SILICONFLOW_API_KEY:}
        model: BAAI/bge-m3
        dimensions: 1024
        timeout: 60s
  search:
    # 索引目录；实际会按 "提供方-维度" 再分子目录，换模型时不会新旧向量混在一起
    index-dir: ./data/index
    top-k: 5
    # RRF 融合参数，60 是常用经验值
    rrf-k: 60
  chat:
    # 每次问答检索多少个片段作为依据
    top-k: 5
    # 多轮对话保留最近多少轮、最多多少字符
    max-history-turns: 6
    max-history-chars: 4000
    # 塞进提示词的资料字符上限，防止上下文过长
    max-context-chars: 6000
    max-sessions: 500
