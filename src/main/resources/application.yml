spring:
  application:
    name: kb-rag-backend
  codec:
    max-in-memory-size: 8MB
  datasource:
    # 开发期先用 H2 文件库，免安装。后期换 PostgreSQL 基本只改这一行。
    url: jdbc:h2:file:./data/kb;MODE=PostgreSQL
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.rag: DEBUG

# 模型接入配置：多提供方从第一天就预留好，M4 阶段直接在这里加备选模型
app:
  llm:
    default-provider: deepseek
    providers:
      deepseek:
        enabled: true
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:}
        chat-model: deepseek-chat
        timeout: 60s
        max-retries: 1
  ingestion:
    # 上传的原始文件落盘位置
    storage-dir: ./data/uploads
  chunking:
    # 分块策略：单块目标长度、块间重叠、允许的最小块
    max-chars: 800
    overlap-chars: 120
    min-chars: 120
